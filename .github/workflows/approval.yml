name: CMSTP Approval Demo

on:
  workflow_dispatch:
    inputs:

      action_type:
        description: "Action"
        required: true
        type: choice
        options:
          - CREATE_REQUEST
          - APPROVE_REQUEST

      ticket_id:
        description: "Ticket ID"
        required: false
        type: string

      approval_level:
        description: "Approval Level"
        required: false
        type: choice
        options:
          - L1
          - L2
          - L3
          - L4
          - L5
          - L6

      decision:
        description: "Decision"
        required: false
        type: choice
        options:
          - APPROVED
          - REJECTED

jobs:

  demo:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - uses: actions/checkout@v4

      - name: Create Request
        if: inputs.action_type == 'CREATE_REQUEST'
        run: |

          mkdir -p approvals

          cat > approvals/CMSTP-1001.json << EOF
          {
            "ticket":"CMSTP-1001",
            "L1":"PENDING",
            "L2":"PENDING",
            "L3":"PENDING",
            "L4":"PENDING",
            "L5":"PENDING",
            "L6":"PENDING"
          }
          EOF

          echo "CMSTP-1001 Created"

      - name: Process Approval
        if: inputs.action_type == 'APPROVE_REQUEST'
        run: |

          FILE="approvals/${{ inputs.ticket_id }}.json"

          python3 - << PY
          import json

          file="${FILE}"
          level="${{ inputs.approval_level }}"
          decision="${{ inputs.decision }}"

          with open(file) as f:
              data=json.load(f)

          data[level]=decision

          with open(file,"w") as f:
              json.dump(data,f,indent=2)

          print("Updated", level, decision)
          PY

      - name: Display Dashboard
        run: |

          FILE="approvals/${{ inputs.ticket_id || 'CMSTP-1001' }}.json"

          if [ -f "$FILE" ]; then

          python3 - << PY
          import json

          with open("$FILE") as f:
              d=json.load(f)

          print("")
          print("===================================")
          print(d["ticket"], "Approval Dashboard")
          print("===================================")

          levels=["L1","L2","L3","L4","L5","L6"]

          for lvl in levels:
              status=d[lvl]

              if status=="APPROVED":
                  icon="✅"
              elif status=="REJECTED":
                  icon="❌"
              else:
                  icon="⏳"

              print(f"{lvl:3} {icon} {status}")

          print("")

          if "REJECTED" in [d[x] for x in levels]:
              print("Overall Status: REJECTED")
          elif all(d[x]=="APPROVED" for x in levels):
              print("Overall Status: APPROVED")
              print("Deployment Allowed ✅")
          else:
              for x in levels:
                  if d[x]=="PENDING":
                      print("Overall Status: WAITING FOR",x)
                      break
          PY

          fi
