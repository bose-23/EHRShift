name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      run-tests:
        description: 'Run pytest? (true/false)'
        required: false
        default: 'true'
      lint:
        description: 'Run flake8? (true/false)'
        required: false
        default: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.10, 3.11, 3.12]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f pyproject.toml ]; then
            pip install .
          fi

      - name: Run tests
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs['run-tests'] == 'true' }}
        run: |
          if command -v pytest >/dev/null 2>&1; then
            pytest -q
          else
            echo "pytest not found; skipping tests"
          fi

      - name: Lint
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs['lint'] == 'true' }}
        run: |
          if command -v flake8 >/dev/null 2>&1; then
            flake8 .
          else
            echo "flake8 not found; skipping lint"
          fi
